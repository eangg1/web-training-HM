<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16a34a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>HM Tracker</title>
<script>try{var t=localStorage.getItem("hm-theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="extra.css">
</head>
<body>
<header>
  <div>
    <h1>21km at 21st birthday</h1>
    <p id="sub"></p>
  </div>
  <div class="hr"><button id="theme" aria-label="Ganti tema">🌙</button><div class="count"><b id="days">–</b><span>hari lagi</span></div></div>
</header>
<main>
  <section id="today" class="view active"></section>
  <section id="plan" class="view"></section>
  <section id="prog" class="view"></section>
  <section id="info" class="view"></section>
</main>
<dialog id="dlg"></dialog>
<nav>
  <button data-v="today" class="on">Hari ini</button>
  <button data-v="plan">Plan</button>
  <button data-v="prog">Progres</button>
  <button data-v="info">Info</button>
</nav>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
